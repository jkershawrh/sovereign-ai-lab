# GCL Constraint Rules for Prompt Governance
#
# Translates the semantic router's regex-based classification into GCL's
# deterministic rule engine format.  The adapter pre-scores each prompt
# against the regex patterns and produces numeric Evidence values
# (injection_score, sensitive_score).  These rules fire on those scores.

rules:
  # ── Prompt injection detection ────────────────────────────────────────
  # Hard compliance constraint — blocks the request entirely.
  - name: prompt_injection_detected
    metric: injection_score
    operator: gt
    threshold: 0.5
    constraint_type: compliance
    hard: true
    confidence: 0.9

  # ── Sensitive content detection ───────────────────────────────────────
  # Soft residency constraint — routes to local processing, writes to ledger
  # but does not block.
  - name: sensitive_content_detected
    metric: sensitive_score
    operator: gt
    threshold: 0.5
    constraint_type: residency
    hard: false
    confidence: 0.8

  # ── Data residency violation ──────────────────────────────────────────
  # Hard compliance constraint — blocks requests that violate OPA policy.
  - name: data_residency_violation
    metric: residency_violation_score
    operator: gt
    threshold: 0.5
    constraint_type: compliance
    hard: true
    confidence: 1.0

# ── Regex patterns ────────────────────────────────────────────────────────
# Used by the adapter to produce the numeric Evidence scores above.
# These match the patterns from the original semantic router verbatim.

patterns:
  sensitive:
    - "health\\s+record|patient|medical|diagnosis|prescription"
    - "financial|bank\\s+account|credit\\s+card|social\\s+security"
    - "personal\\s+data|biometric|genetic|disability"
    - "retention\\s+rule|data\\s+residency|cross.border|pii"

  injection:
    - "ignore\\s+(all\\s+)?previous|system\\s+prompt"
    - "disregard.*instructions|override|jailbreak"
    - "you\\s+are\\s+now|act\\s+as\\s+if|pretend\\s+you"
    - "output\\s+your\\s+(system|initial)|reveal\\s+your"
    - "repeat\\s+your\\s+(initial\\s+)?instructions|show\\s+your\\s+instructions"
