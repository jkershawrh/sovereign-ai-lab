---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-adapter
  namespace: sovereign-ai-lab
  labels:
    app: prompt-adapter
    app.kubernetes.io/part-of: sovereign-ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prompt-adapter
  template:
    metadata:
      labels:
        app: prompt-adapter
    spec:
      containers:
        - name: adapter
          image: quay.io/sovereign-ai-lab/sovereign-prompt-adapter:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
          env:
            - name: SR_BACKEND
              value: "http://ovms-sovereign-granite:8080/v3/chat/completions"
            - name: SR_MODEL
              value: "granite-3.2-sovereign"
            - name: SR_LEDGER_API
              value: "http://ledger-gateway:28099/api/entries"
            - name: SR_PORT
              value: "8001"
            - name: GCL_OPA_ENDPOINT
              value: "http://opa:8181/v1/data/sovereign/data_residency/allow"
            - name: GCL_FORCE_DETERMINISTIC
              value: "true"
            - name: GCL_RUNTIME_MODE
              value: "standalone-test"
            - name: GCL_LEDGER_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-adapter
  namespace: sovereign-ai-lab
spec:
  selector:
    app: prompt-adapter
  ports:
    - port: 8001
      targetPort: 8001
