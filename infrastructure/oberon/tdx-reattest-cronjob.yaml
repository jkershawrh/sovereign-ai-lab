---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tdx-reattest
  namespace: sovereign-ai-lab
  labels:
    app: tdx-reattest
    app.kubernetes.io/part-of: sovereign-ai-lab
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: tdx-reattest
        spec:
          runtimeClassName: kata-cc
          restartPolicy: OnFailure
          containers:
            - name: reattest
              image: quay.io/redhat-gpte/sovereign-demo-api:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  LEDGER_API="${LEDGER_API:-http://ledger-gateway:28099}"
                  TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

                  # Platform evidence from /proc (always available in containers)
                  TDX_CPU="false"
                  grep -q "tdx_host_platform" /proc/cpuinfo 2>/dev/null && TDX_CPU="true"

                  CPU_MODEL=$(grep -m1 "model name" /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs || echo "unknown")

                  # SGX check (device may not be mounted but we can check /proc)
                  SGX_PRESENT="false"
                  [ -e /dev/sgx_provision ] && SGX_PRESENT="true"

                  ATTESTATION_LEVEL="platform-cpuinfo"
                  [ "$TDX_CPU" = "true" ] && ATTESTATION_LEVEL="tdx-host-confirmed"

                  QUOTE_HASH=$(echo -n "reattest-${TIMESTAMP}-${CPU_MODEL}-tdx:${TDX_CPU}" | sha256sum | cut -d' ' -f1)

                  python3 -c "
                  import json, urllib.request
                  content = {
                      'tcb_status': 'platform-measured',
                      'attestation_level': '${ATTESTATION_LEVEL}',
                      'quote_hash': '${QUOTE_HASH}',
                      'timestamp': '${TIMESTAMP}',
                      'tdx_cpu': '${TDX_CPU}' == 'true',
                      'sgx_present': '${SGX_PRESENT}' == 'true',
                      'cpu_model': '${CPU_MODEL}',
                      'source': 'periodic-reattestation',
                  }
                  body = json.dumps({
                      'entry_type': 'tdx.attestation.completed',
                      'agent_id': 'infra/tdx/reattest-cronjob',
                      'content': json.dumps(content),
                      'content_type': 'application/json',
                      'source_id': 'sovereign-ai-lab',
                  }).encode()
                  req = urllib.request.Request('${LEDGER_API}/api/entries', data=body,
                                               headers={'Content-Type': 'application/json'})
                  try:
                      resp = json.loads(urllib.request.urlopen(req, timeout=10).read())
                      print(f'Re-attestation [${ATTESTATION_LEVEL}]: {resp.get(\"entry_hash\", \"unknown\")[:24]}...')
                  except Exception as e:
                      print(f'Ledger write failed: {e}')
                      exit(1)
                  "
              env:
                - name: LEDGER_API
                  value: "http://ledger-gateway:28099"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
